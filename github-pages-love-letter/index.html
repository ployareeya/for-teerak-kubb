<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9d9e2">
  <title>LetterForMyGF</title>
  <meta name="description" content="จดหมายเล็ก ๆ และกำลังใจให้คนที่รัก">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f9d9e2'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap");
    :root { font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif; color: #8c3f55; background: #fff0f4; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; overflow-x: hidden; }
    main { position: relative; width: min(100%, 996px); min-height: min(670px, 100svh); padding: 32px 18px 38px; background: #f9d9e2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    h1 { font-size: clamp(1.55rem, 5vw, 2.3rem); line-height: 1.4; margin: 0 0 8px; color: #ae4b68; }
    .hint { margin: 0 0 25px; font-size: 1rem; }
    .scene { width: min(100%, 900px); height: 560px; position: relative; display: grid; place-items: center; isolation: isolate; }
    .front-prompt { position: absolute; top: 60px; left: 0; right: 0; margin: 0; color: #af4969; font-family: "Mali", "Thonburi", "Noto Sans Thai", sans-serif; font-size: clamp(1.35rem, 4vw, 2rem); font-weight: 700; line-height: 1.5; transition: opacity .25s ease; }
    .front-prompt.hidden { opacity: 0; pointer-events: none; }
    .envelope-button { width: 290px; height: 245px; position: relative; border: 0; padding: 0; background: transparent; cursor: pointer; filter: drop-shadow(0 12px 14px #bb637168); }
    .envelope-button:focus-visible, button:focus-visible { outline: 3px solid #ad355a; outline-offset: 6px; }
    .back { position: absolute; left: 0; bottom: 0; width: 290px; height: 190px; background: #f98494; }
    .flap { position: absolute; left: 0; bottom: 190px; width: 290px; height: 100px; background: #f14858; clip-path: polygon(0 100%, 50% 0, 100% 100%); transform-origin: center bottom; transition: transform .55s ease; }
    .paper { position: absolute; left: 18px; bottom: 55px; width: 254px; height: 160px; background: #ffe8ec; display: flex; align-items: center; justify-content: center; color: #d91419; font-size: 4.2rem; transition: transform .8s cubic-bezier(.2,.8,.2,1); z-index: 1; box-shadow: 0 3px 12px #c0667733; }
    .front { position: absolute; left: 0; bottom: 0; width: 290px; height: 190px; z-index: 2; background: #ff9da9; clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); }
    .fold { position: absolute; left: 0; bottom: 0; width: 290px; height: 190px; z-index: 3; background: #fa8393; clip-path: polygon(0 100%, 50% 50%, 100% 100%); }
    .envelope-button.open .flap { transform: rotateX(180deg); z-index: 0; }
    .envelope-button.open .paper { transform: translateY(-105px); }
    .hearts { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 6; }
    .burst-heart { position: absolute; left: 50%; top: 53%; color: #d20d18; font-size: var(--size); opacity: 0; animation: burst 1.8s cubic-bezier(.16,.7,.28,1) forwards; animation-delay: var(--delay); text-shadow: 0 4px 5px #ac3e5650; }
    @keyframes burst { 0% { opacity: 0; transform: translate(-50%,0) scale(.3) rotate(-12deg); } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)),var(--y)) scale(1.2) rotate(var(--rotate)); } }
    .message { position: absolute; inset: 175px 0 auto; z-index: 5; width: min(100%, 430px); margin: auto; padding: 40px 28px 26px; border: 1px solid #f4d4dc; border-radius: 4px; background: #fffdfd; box-shadow: 0 13px 35px #b96b7b55; text-align: center; opacity: 0; transform: translateY(75px) scale(.72) rotate(-3deg); pointer-events: none; transition: opacity .6s ease, transform .65s cubic-bezier(.2,1.4,.3,1); }
    .message.visible { opacity: 1; transform: translateY(0) scale(1) rotate(0); pointer-events: auto; }
    .message h2 { margin: 0 0 10px; color: #b63f60; font-size: 1.45rem; font-family: "Comic Sans MS", cursive; }
    .message p { margin: 0 0 11px; line-height: 1.75; font-size: 1rem; font-family: "Mali", "Thonburi", "Noto Sans Thai", sans-serif; }
    .message .thai-message { font-size: 1.22rem; font-weight: 700; color: #b94c70; line-height: 1.85; }
    .message .signature { margin: 14px 0 0; text-align: center; font-weight: 700; color: #b63f60; }
    .polaroid { position: absolute; z-index: 7; width: 120px; padding: 7px 7px 18px; background: white; box-shadow: 0 8px 20px #aa617546; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .45s ease, transform .5s ease; }
    .scene.show-photos .polaroid { opacity: 1; pointer-events: auto; }
    .polaroid input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .polaroid:focus-within { outline: 3px solid #ae4b68; }
    .polaroid img, .photo-placeholder { display: grid; place-items: center; width: 100%; height: 100px; object-fit: cover; background: #fce4e9; }
    .polaroid img[hidden], .photo-placeholder[hidden] { display: none; }
    .photo-placeholder { color: #b45570; font-size: 2.2rem; }
    .polaroid small { display: block; padding-top: 7px; color: #a45c73; font-size: .75rem; font-family: "Comic Sans MS", cursive; white-space: nowrap; }
    .photo-1 { top: 75px; left: calc(50% - 195px); transform: translateY(20px) rotate(-11deg); }
    .photo-2 { top: 63px; left: calc(50% + 80px); transform: translateY(20px) rotate(8deg); }
    .photo-3 { top: 328px; left: calc(50% - 178px); transform: translateY(20px) rotate(7deg); }
    .photo-4 { top: 325px; left: calc(50% + 72px); transform: translateY(20px) rotate(-9deg); }
    .photo-5 { top: 205px; left: calc(50% - 280px); transform: translateY(20px) rotate(-5deg); }
    .photo-6 { top: 210px; left: calc(50% + 166px); transform: translateY(20px) rotate(6deg); }
    .scene.show-photos .photo-1 { transform: rotate(-11deg); }
    .scene.show-photos .photo-2 { transform: rotate(8deg); }
    .scene.show-photos .photo-3 { transform: rotate(7deg); }
    .scene.show-photos .photo-4 { transform: rotate(-9deg); }
    .scene.show-photos .photo-5 { transform: rotate(-5deg); }
    .scene.show-photos .photo-6 { transform: rotate(6deg); }
    .controls { display: flex; gap: 14px; margin-top: 5px; flex-wrap: wrap; justify-content: center; }
    .controls[hidden] { display: none; }
    .controls button { min-width: 110px; min-height: 43px; padding: 8px 18px; border: 2px solid #ce7286; border-radius: 4px; background: transparent; color: #ba516b; font-family: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; }
    .controls button:hover { background: #ffe9ee; }
    @media (max-width: 600px) {
      main { min-height: 100svh; padding: 18px 12px 26px; }
      .scene { height: 570px; }
      .front-prompt { top: 50px; font-size: 1.45rem; }
      .message { top: 180px; width: min(100%, 350px); padding: 38px 16px 24px; }
      .message p { font-size: 1rem; }
      .polaroid { width: 80px; padding: 4px 4px 13px; }
      .polaroid img, .photo-placeholder { height: 72px; }
      .polaroid small { font-size: .62rem; }
      .photo-1 { top: 70px; left: calc(50% - 135px); }
      .photo-2 { top: 58px; left: calc(50% + 50px); }
      .photo-3 { top: 355px; left: calc(50% - 125px); }
      .photo-4 { top: 350px; left: calc(50% + 45px); }
      .photo-5 { top: 445px; left: calc(50% - 92px); }
      .photo-6 { top: 443px; left: calc(50% + 12px); }
      .envelope-button { transform: scale(.9); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>

  </main>
  <script>
    const envelope = document.getElementById('envelope');
    const message = document.getElementById('message');
    const hearts = document.getElementById('hearts');
    const scene = document.getElementById('scene');
    const frontPrompt = document.getElementById('front-prompt');
    const controls = document.getElementById('controls');
    let timer;
    function openLetter() {
      if (envelope.classList.contains('open')) return;
      envelope.classList.add('open'); frontPrompt.classList.add('hidden');
      hearts.replaceChildren();
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (let i = 0; i < 18; i++) {
          const heart = document.createElement('span');
          heart.className = 'burst-heart'; heart.textContent = '♥';
          heart.style.setProperty('--x', `${(Math.random() - .5) * 390}px`);
          heart.style.setProperty('--y', `${-100 - Math.random() * 235}px`);
          heart.style.setProperty('--size', `${19 + Math.random() * 28}px`);
          heart.style.setProperty('--rotate', `${(Math.random() - .5) * 70}deg`);
          heart.style.setProperty('--delay', `${Math.random() * .35}s`);
          hearts.append(heart);
        }
      }
      timer = setTimeout(() => { message.classList.add('visible'); scene.classList.add('show-photos'); controls.hidden = false; message.focus({preventScroll:true}); }, 900);
    }
    function resetLetter() {
      clearTimeout(timer); message.classList.remove('visible'); controls.hidden = true;
      envelope.classList.remove('open'); frontPrompt.classList.remove('hidden'); scene.classList.remove('show-photos'); hearts.replaceChildren();
      envelope.focus({preventScroll:true});
    }
    envelope.addEventListener('click', openLetter);
    document.getElementById('reset').addEventListener('click', resetLetter);
    document.querySelectorAll('.polaroid').forEach(card => {
      card.querySelector('input').addEventListener('change', event => {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          card.querySelector('img').src = reader.result;
          card.querySelector('img').hidden = false;
          card.querySelector('.photo-placeholder').hidden = true;
        };
        reader.readAsDataURL(file);
      });
    });

  </script>
